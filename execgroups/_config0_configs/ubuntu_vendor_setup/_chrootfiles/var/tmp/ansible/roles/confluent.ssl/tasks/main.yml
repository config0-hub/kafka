---
# Every service user's primary group. Made here, before any Confluent package
# installs, so the stores below can be given to it.
- name: Create Confluent Group
  group:
    name: confluent
    system: true

- name: Delete SSL Certificate Directory
  file:
    path: /var/ssl/private
    state: absent

- name: Create SSL Certificate Generation Directory
  file:
    path: /var/ssl/private/generation
    state: directory
    mode: 0755

- name: Create Keystore and Truststore with Self Signed Certs
  include_tasks: self_signed_certs.yml

- set_fact:
    certs_updated: true

- name: Delete SSL Certificate Generation Directory
  file:
    path: /var/ssl/private/generation
    state: absent

# The host run's umask 077 leaves the stores 0600 root. Each service runs as
# its own user in group confluent and reads them.
- name: Let the Confluent Group Enter the SSL Directory
  file:
    path: /var/ssl/private
    state: directory
    owner: root
    group: confluent
    mode: '0750'

- name: Let the Confluent Group Read the Keystore and Truststore
  file:
    path: "{{ item }}"
    owner: root
    group: confluent
    mode: '0640'
  loop:
    - "{{ keystore_path }}"
    - "{{ truststore_path }}"
